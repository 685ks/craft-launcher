# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). It then runs packaging/freebsd/package.sh, the script the
# release job runs, and checks the tarball, so a broken FreeBSD package fails here before it can
# fail a release. Nothing is uploaded and no secrets are used.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every push
# or dependency change: a drifted dependency still shows up within a day, and always before a
# release ships. PRs that change the FreeBSD packaging itself still run it.
on:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FREEBSD_RELEASE: "14.3"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  freebsd:
    name: FreeBSD x86_64 (build, test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The packages give the build what pkg-config and the linker look for (X11, Wayland,
      # xkbcommon, GL); the tray and notifications are pure-Rust D-Bus clients. Rust comes from
      # rustup so the toolchain matches the other CI jobs (stable, rust-version 1.90 or newer).
      - name: Build, test and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          usesh: true
          envs: "CARGO_TERM_COLOR CARGO_BUILD_JOBS"
          prepare: |
            set -e
            pkg install -y bash curl git pkgconf libX11 libXcursor libXrandr libXi libxcb \
              libxkbcommon wayland mesa-libs
            curl -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable --no-modify-path
          run: |
            set -e
            . "$HOME/.cargo/env"
            rustc --version
            cargo --version
            freebsd-version
            cargo build --workspace --locked
            cargo test --workspace --locked
            packaging/freebsd/package.sh
            version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
            base="arthavan-projects-$version-freebsd-x86_64"
            tarball="dist/release/$base.tar.gz"
            test -s "$tarball"
            tar -tzf "$tarball" | sort >/tmp/listing.txt
            cat /tmp/listing.txt
            for f in "bin/arthavan-projects" \
              "share/applications/app.freedev.ainz.ks.ArthavanProjects.desktop" \
              "share/metainfo/app.freedev.ainz.ks.ArthavanProjects.metainfo.xml" \
              "share/icons/hicolor/256x256/apps/app.freedev.ainz.ks.ArthavanProjects.png" \
              "share/doc/arthavan-projects/LICENSE-MIT" \
              "share/doc/arthavan-projects/LICENSE-APACHE"; do
              grep -qx "$base/$f" /tmp/listing.txt || { echo "missing from the tarball: $f"; exit 1; }
            done
            rm -rf /tmp/unpack
            mkdir -p /tmp/unpack
            tar -xzf "$tarball" -C /tmp/unpack
            exe="/tmp/unpack/$base/bin/arthavan-projects"
            file "$exe"
            file "$exe" | grep -q "FreeBSD"
            out="$("$exe" --version)"
            echo "$out"
            test "$out" = "arthavan-projects $version"

# Builds the launcher for Windows, macOS and Linux and publishes a GitHub Release on this
# repository, with stable asset names so that
#   https://github.com/<owner>/<repo>/releases/latest/download/<APP_SLUG>-<platform>.<ext>
# always points at the newest stable build (the download page in site/ links there).
#
# Triggers:
#   - pushing a tag v<version>: <version> must equal [workspace.package] version in Cargo.toml
#     (the binary reports that version, and self-update compares against it).
#   - workflow_dispatch: builds everything; publishes only when `publish` is ticked, tagging
#     v<Cargo.toml version> at the dispatched commit.
#
# Signing is optional. Without the secrets below the builds are unsigned (macOS: ad-hoc signed,
# not notarized) and the workflow still succeeds:
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD,
#            APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID  (notarization needs all three)
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#            or Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
# The packaging scripts under packaging/ do the building, signing and packing; this file only
# runs them and names the results.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (tag v<Cargo.toml version>) after building"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ---- product name: the one place to change it -----------------------------------------------
  APP_NAME: Craft Launcher
  APP_SLUG: craft-launcher
  # ---------------------------------------------------------------------------------------------
  # Cargo package and the asset stem the launcher's self-update looks for
  # (crates/core/src/catalog.rs LAUNCHER_ID). Not a display name; changing it needs a code change.
  PKG: artcraft-launcher
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version and check the tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml version $version (expected v$version)"
              exit 1
            fi
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "version $version (prerelease: $pre)"

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    env:
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version

      # WiX v5 for the MSI, as packaging/windows/package.ps1 documents.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          wix --version

      - name: Build, sign and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        # sign.ps1 leaves the files unsigned (with a warning) when no signing secret is set.
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Name the assets
        shell: bash
        run: |
          set -euo pipefail
          src="dist/release/$PKG-$ARTCRAFT_LAUNCHER_VERSION-windows-x64"
          mkdir -p upload
          # Versioned files: what the launcher's self-update downloads.
          cp "$src-portable.zip" "$src.msi" upload/
          # Stable names: what releases/latest/download/<name> serves.
          cp "$src-portable.zip" "upload/$APP_SLUG-windows-x64.zip"
          cp "$src.msi" "upload/$APP_SLUG-windows-x64.msi"
          ls -l upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: upload/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal
    needs: meta
    runs-on: macos-latest
    env:
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
          rustc --version

      # Writes MACOS_SIGN_IDENTITY / MACOS_KEYCHAIN to $GITHUB_ENV when APPLE_CERTIFICATE is set;
      # otherwise warns and exits 0, and package.sh signs ad hoc.
      - name: Import the signing certificate (if any)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh

      # Builds both architectures, joins them with lipo, assembles and signs the .app and packs
      # it into a DMG with hdiutil; notarizes when a real identity and APPLE_ID/APPLE_PASSWORD/
      # APPLE_TEAM_ID are all present.
      - name: Build, sign and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal

      # Strict when signed and notarized; integrity-only (with warnings) for unsigned builds.
      - name: Check the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/verify.sh --arch universal

      - name: Name the assets
        run: |
          set -euo pipefail
          src="dist/release/$PKG-$ARTCRAFT_LAUNCHER_VERSION-macos-universal.dmg"
          mkdir -p upload
          cp "$src" upload/
          cp "$src" "upload/$APP_SLUG-macos-universal.dmg"
          ls -l upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: upload/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x86_64
    needs: meta
    # The oldest supported image, so the binary's glibc requirement stays low
    # (packaging/linux/package.sh). Move to ubuntu-24.04 if GitHub retires 22.04.
    runs-on: ubuntu-22.04
    env:
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # egui/winit headers (as in ci.yml), plus zsync for the AppImage's delta-update file.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev zsync

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      # TODO: package.sh downloads appimagetool from its "continuous" release when it isn't on
      # PATH; pin a specific appimagetool release and checksum here (APPIMAGETOOL=<path>).
      - name: Build and package (AppImage, tar.gz)
        run: packaging/linux/package.sh --formats "appimage tar"

      - name: Name the assets
        run: |
          set -euo pipefail
          src="dist/release/$PKG-$ARTCRAFT_LAUNCHER_VERSION-linux-x86_64"
          mkdir -p upload
          cp "$src.AppImage" "$src.tar.gz" upload/
          if [ -f "$src.AppImage.zsync" ]; then cp "$src.AppImage.zsync" upload/; fi
          cp "$src.AppImage" "upload/$APP_SLUG-linux-x86_64.AppImage"
          cp "$src.tar.gz" "upload/$APP_SLUG-linux-x86_64.tar.gz"
          ls -l upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: upload/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [meta, windows, macos, linux]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # SHA256SUMS.txt is the name the launcher looks for when it verifies a download.
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum >../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create or update the release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: replacing its assets"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=(--title "$APP_NAME $VERSION" --generate-notes --target "$TARGET_SHA")
            # Pre-releases (versions with a "-") never become releases/latest.
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi

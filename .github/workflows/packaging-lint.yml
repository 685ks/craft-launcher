# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# and the packaging shell/PowerShell scripts.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  lint:
    name: Packaging lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned releases, checked against their SHA-256 before use.
      - name: Install shellcheck and actionlint
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$RUNNER_TEMP"
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$sc"
          echo "$SHELLCHECK_SHA256  $sc" | sha256sum -c -
          tar -xJf "$sc"
          install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$tools/"
          al="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$al"
          echo "$ACTIONLINT_SHA256  $al" | sha256sum -c -
          tar -xzf "$al" actionlint
          install -m 755 actionlint "$tools/"
          echo "$tools" >>"$GITHUB_PATH"

      # actionlint also runs shellcheck over every `run:` block.
      - name: actionlint
        run: |
          shellcheck --version
          actionlint -version
          actionlint -color

      - name: shellcheck
        run: shellcheck packaging/*.sh packaging/*/*.sh

      # Every PowerShell script must parse, and PSScriptAnalyzer (preinstalled on the runner)
      # must report no errors.
      - name: PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Path packaging -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) { Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else {
              Write-Output "ok $($f.Name) parses"
            }
          }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            $found = Invoke-ScriptAnalyzer -Path packaging -Recurse -Severity Error
            foreach ($d in $found) {
              $failed = $true
              Write-Output "::error file=$($d.ScriptPath),line=$($d.Line)::$($d.RuleName): $($d.Message)"
            }
          } else {
            Write-Output '::warning::PSScriptAnalyzer is not installed on this runner; parse check only'
          }
          if ($failed) { exit 1 }
